{% extends "base.html" %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/error.css') }}">
{% endblock %}

{% block main %}
<div class="error-container-wrapper">
    <div class="error-container">
        <div class="error-code">500</div>
        <h1>サーバーエラーが発生しました</h1>
        <p>一時的な不具合が発生しています。しばらく経ってからもう一度お試しください。</p>
        <div class="error-actions">
            <a href="{{ url_for('index') }}" class="btn-primary">TOPへ戻る</a>
        </div>
    </div>
</div>
{% endblock %}
